services:
  order-service:
    build: ./
    ports:
      - "4000:8080"
    environment:
      OTEL_TRACES_EXPORTER: "jaeger,zipkin,otlp"
      OTEL_EXPORTER_JAEGER_ENDPOINT: "http://jaeger:14250"
      OTEL_EXPORTER_ZIPKIN_ENDPOINT: "http://zipkin:9411/api/v2/spans"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://tempo:4317"
      OTEL_METRICS_EXPORTER: "prometheus"
      OTEL_EXPORTER_PROMETHEUS_PORT: "9464"
      OTEL_EXPORTER_PROMETHEUS_HOST: "0.0.0.0"
      OTEL_LOGS_EXPORTER: "otlp"
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "http://collector:4317"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/opentelemetry"
    depends_on:
      - postgres
      - jaeger-all-in-one
      - zipkin-all-in-one
      - collector
      - tempo

  postgres:
    container_name: postgres
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_DB: opentelemetry
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    ports:
      - "4001:5432"

  jaeger-all-in-one:
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: true
    image: jaegertracing/all-in-one:1.35
    restart: always
    ports:
      - "4002:16686" # HTTP	query	serve frontend
      - "4003:14250" # HTTP	collector	accept model.proto

  zipkin-all-in-one:
    container_name: zipkin
    image: openzipkin/zipkin:3.4
    restart: always
    ports:
      - "4004:9411"

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.1.0
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=exemplar-storage
    depends_on:
      - order-service
    ports:
      - "4005:9090"

  grafana:
    container_name: grafana
    image: grafana/grafana:11.4.0
    volumes:
      - ./docker/grafana/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    restart: always
    ports:
      - "4006:3000"
    depends_on:
      - prometheus

  collector:
    container_name: collector
    image: otel/opentelemetry-collector-contrib:0.91.0
    command:
      - --config=/etc/otelcol-contrib/otel-collector.yml
    volumes:
      - ./docker/collector/otel-collector.yml:/etc/otelcol-contrib/otel-collector.yml
    restart: always
    ports:
      - "4317" # OTLP gRPC receiver
    depends_on:
      - loki

  loki:
    container_name: loki
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/local-config.yaml
    restart: always
    ports:
      - "3100"

  tempo:
    container_name: tempo
    image: grafana/tempo:2.2.4
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./docker/tempo/tempo.yml:/etc/tempo.yml
    restart: always
    ports:
      - "4317"  # otlp grpc
      - "3200"  # tempo as grafana datasource
