services:
  order-service:
    build: ./order-service
    ports:
      - "4000:8080"
    environment:
      OTEL_SERVICE_NAME: "order-service"
      OTEL_RESOURCE_ATTRIBUTES: "service=order-service,env=dev"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://collector:4317"
      OTEL_LOGS_EXPORTER: "otlp"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/opentelemetry"
    depends_on:
      - postgres
      - collector

  postgres:
    container_name: postgres
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_DB: opentelemetry
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    ports:
      - "4001:5432"

  jaeger-all-in-one:
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: true
    image: jaegertracing/all-in-one:1.35
    restart: always
    ports:
      - "4002:16686" # HTTP	query	serve frontend
      - "4317" # HTTP	collector	accept model.proto

  zipkin-all-in-one:
    container_name: zipkin
    image: openzipkin/zipkin:3.4
    restart: always
    ports:
      - "4004:9411"

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.1.0
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=exemplar-storage
      - --web.enable-remote-write-receiver # To see the metrics from tempo (metrics_generator.storage.remote_write
    depends_on:
      - collector
    ports:
      - "4005:9090"

  grafana:
    container_name: grafana
    image: grafana/grafana:11.4.0
    volumes:
      - ./docker/grafana/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    restart: always
    ports:
      - "4006:3000"
    depends_on:
      - prometheus
      - loki
      - jaeger-all-in-one
      - zipkin-all-in-one
      - tempo

  collector:
    container_name: collector
    image: otel/opentelemetry-collector-contrib:0.91.0
    command:
      - --config=/etc/otelcol-contrib/otel-collector.yml
    volumes:
      - ./docker/collector/otel-collector.yml:/etc/otelcol-contrib/otel-collector.yml
    restart: always
    ports:
      - "4007:4317" # OTLP gRPC receiver
      - "8889" # Prometheus exporter metrics
    depends_on:
      - loki
      - jaeger-all-in-one
      - zipkin-all-in-one
      - tempo

  loki:
    container_name: loki
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/local-config.yaml
    restart: always
    ports:
      - "3100"

  tempo:
    container_name: tempo
    image: grafana/tempo:2.2.4
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./docker/tempo/tempo.yml:/etc/tempo.yml
    restart: always
    ports:
      - "4317"  # otlp grpc
      - "3200"  # tempo as grafana datasource
